}
.lightbox .close, .lightbox .nav {
    position:absolute; color:#fff; cursor:pointer;
    background:rgba(255,255,255,.08); border:none;
    border-radius:50%; width:44px; height:44px;
    font-size:1.3rem;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s;
}
.lightbox .close:hover, .lightbox .nav:hover { background:rgba(255,255,255,.2); }
.lightbox .close { top:20px; right:24px; }
.lightbox .nav.prev { left:16px; top:50%; transform:translateY(-50%); }
.lightbox .nav.next { right:16px; top:50%; transform:translateY(-50%); }
.lightbox .info { margin-top:10px; color:#888; font-size:.85rem; }
.empty { text-align:center; padding:80px 20px; color:#555; font-size:1.1rem; }
.empty.hidden { display:none; }
#progress { text-align:center; padding:8px; color:#444; font-size:.75rem; }

var filtered = ALL.slice();
var curIdx = -1;
var loaded = 0;
var BATCH = 60;

function makeCard(d, idx) {
    var c = document.createElement('div');
    c.className = 'card';
    c.onclick = function(){ openLB(idx); };
    var img = document.createElement('img');
    img.setAttribute('data-src', d.thumb);
    img.alt = d.name;
    c.appendChild(img);
    var n = document.createElement('div');
    n.className = 'name';
    n.textContent = d.name;
    c.appendChild(n);
    return c;
}

function renderBatch(s, n) {
    var g = document.getElementById('gallery');
    var end = Math.min(s + n, filtered.length);
    for (var i = s; i < end; i++) g.appendChild(makeCard(filtered[i], i));
    loaded = end;
    updateStatus();
    observe();
}

function observe() {
    var o = new IntersectionObserver(function(es) {
        es.forEach(function(e) {
            if (e.isIntersecting) {
                var img = e.target.querySelector('img');
                if (img && img.getAttribute('data-src')) {
                    img.src = img.getAttribute('data-src');
                    img.removeAttribute('data-src');
                    img.onload = function(){ img.classList.add('loaded'); };
                }
                o.unobserve(e.target);
            }
        });
    }, { rootMargin:'400px' });
    document.querySelectorAll('.card').forEach(function(c) {
        var img = c.querySelector('img');
        if (img && img.getAttribute('data-src')) o.observe(c);
    });
}

function loadMore() { if (loaded < filtered.length) renderBatch(loaded, BATCH); }

function updateStatus() {
    var s = document.getElementById('progress');
    s.textContent = loaded >= filtered.length ? '全部 ' + filtered.length + ' 张已加载' : '已加载 ' + loaded + ' / ' + filtered.length;
}

function filter() {
    var q = document.getElementById('search').value.toLowerCase();
    filtered = ALL.filter(function(d){ return d.name.toLowerCase().indexOf(q) !== -1; });
    document.getElementById('gallery').innerHTML = '';
    document.getElementById('resultCount').textContent = filtered.length + ' 个结果';
    document.getElementById('empty').classList.toggle('hidden', filtered.length > 0);
    loaded = 0; curIdx = -1;
    if (filtered.length > 0) loadMore();
}

function openLB(idx) {
    curIdx = idx;
    var d = filtered[idx];
    document.getElementById('lbImg').src = d.thumb;
    document.getElementById('lbInfo').textContent = (idx + 1) + ' / ' + filtered.length + '  ' + d.name;
    document.getElementById('lightbox').classList.add('active');
}

function closeLB() { document.getElementById('lightbox').classList.remove('active'); }

function navLB(dir) {
    curIdx = (curIdx + dir + filtered.length) % filtered.length;
    var d = filtered[curIdx];
    document.getElementById('lbImg').src = d.thumb;
    document.getElementById('lbInfo').textContent = (curIdx + 1) + ' / ' + filtered.length + '  ' + d.name;
}

document.addEventListener('keydown', function(e) {
    if (document.getElementById('lightbox').classList.contains('active')) {
        if (e.key === 'Escape') closeLB();
        if (e.key === 'ArrowLeft') navLB(-1);
        if (e.key === 'ArrowRight') navLB(1);
    }
});

window.addEventListener('scroll', function() {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) loadMore();
});

filter();
</script>
